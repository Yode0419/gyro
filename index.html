<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陀螺儀數據測試</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .data { font-size: 20px; margin: 10px; }
        .cube-container { width: 200px; height: 200px; perspective: 600px; margin: 20px auto; position: relative; }
        .cube { width: 100px; height: 60px; background: rgba(0, 0, 255, 0.5); position: absolute; top: 50%; left: 50%; transform-style: preserve-3d; transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg); }
        .arrow { position: absolute; font-size: 24px; font-weight: bold; display: none; }
        .arrow.show { display: block; }
        .arrow.up { top: -30px; left: 50%; transform: translateX(-50%); }
        .arrow.down { bottom: -30px; left: 50%; transform: translateX(-50%); }
        .arrow.left { left: -30px; top: 50%; transform: translateY(-50%); }
        .arrow.right { right: -30px; top: 50%; transform: translateY(-50%); }
    </style>
</head>
<body>
    <h2>手機陀螺儀與加速度數據</h2>
    <p>允許裝置存取陀螺儀以查看數據</p>
    <button id="enableSensors">啟用感測器</button>
    <button id="resetCube">復位</button>
    
    <div class="cube-container">
        <div id="cube" class="cube"></div>
        <div id="arrowUp" class="arrow up">⬆</div>
        <div id="arrowDown" class="arrow down">⬇</div>
        <div id="arrowLeft" class="arrow left">⬅</div>
        <div id="arrowRight" class="arrow right">➡</div>
    </div>
    
    <script>
        let initialAlpha = 0, initialBeta = 0, initialGamma = 0;
        let isInitialSet = false;
        
        function handleOrientation(event) {
            if (!isInitialSet) {
                initialAlpha = event.alpha;
                initialBeta = event.beta;
                initialGamma = event.gamma;
                isInitialSet = true;
            }
            
            let rotX = event.beta - initialBeta;
            let rotY = event.gamma - initialGamma;
            document.getElementById("cube").style.transform = `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }
        
        function handleMotion(event) {
            let accel = event.acceleration;
            document.getElementById("arrowUp").classList.toggle("show", accel.y < -2);
            document.getElementById("arrowDown").classList.toggle("show", accel.y > 2);
            document.getElementById("arrowLeft").classList.toggle("show", accel.x < -2);
            document.getElementById("arrowRight").classList.toggle("show", accel.x > 2);
        }
        
        document.getElementById("enableSensors").addEventListener("click", () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === "granted") {
                            window.addEventListener("deviceorientation", handleOrientation);
                            window.addEventListener("devicemotion", handleMotion);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener("deviceorientation", handleOrientation);
                window.addEventListener("devicemotion", handleMotion);
            }
        });
        
        document.getElementById("resetCube").addEventListener("click", () => {
            isInitialSet = false;
        });
    </script>
</body>
</html>
