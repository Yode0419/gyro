<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陀螺儀數據測試</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .data { font-size: 20px; margin: 10px; }
        .plane-container { width: 300px; height: 300px; position: relative; margin: 20px auto; border: 2px dashed gray; }
        .center-line {
            position: absolute;
            background: red;
        }
        .horizontal-line {
            width: 100%;
            height: 2px;
            top: 50%;
            left: 0;
        }
        .vertical-line {
            width: 2px;
            height: 100%;
            top: 0;
            left: 50%;
        }
        .cube { width: 80px; height: 120px; background: rgba(0, 0, 255, 0.5); position: absolute; top: 50%; left: 50%; transform-style: preserve-3d; transform: translate(-50%, -50%) rotateX(0deg) rotateY(0deg); }
    </style>
</head>
<body>
    <h2>手機陀螺儀與加速度數據</h2>
    <p>允許裝置存取陀螺儀以查看數據</p>
    <button id="enableSensors">啟用感測器</button>
    <button id="resetCube">復位</button>
    
    <div class="plane-container">
        <div class="center-line horizontal-line"></div>
        <div class="center-line vertical-line"></div>
        <div id="cube" class="cube"></div>
    </div>
    
    <script>
        let initialAlpha = 0, initialBeta = 0, initialGamma = 0;
        let isInitialSet = false;
        let posX = 150, posY = 150, size = 80;
        const cube = document.getElementById("cube");

        function handleOrientation(event) {
            if (!isInitialSet) {
                initialAlpha = event.alpha;
                initialBeta = event.beta;
                initialGamma = event.gamma;
                isInitialSet = true;
            }
            
            let rotX = event.beta - initialBeta;
            let rotY = event.gamma - initialGamma;
            cube.style.transform = `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }
        
        function handleMotion(event) {
            let accel = event.acceleration;
            let correctedX = accel.x * Math.cos(initialBeta * Math.PI / 180) + accel.z * Math.sin(initialBeta * Math.PI / 180);
            let correctedY = accel.y;
            
            posX = Math.min(Math.max(posX + correctedX * 2, 0), 300);
            posY = Math.min(Math.max(posY - correctedY * 2, 0), 300);
            size = Math.max(40, Math.min(120, size + accel.z * 2));
            
            cube.style.left = `${posX}px`;
            cube.style.top = `${posY}px`;
            cube.style.width = `${size}px`;
            cube.style.height = `${size * 1.5}px`;
        }
        
        document.getElementById("enableSensors").addEventListener("click", () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === "granted") {
                            window.addEventListener("deviceorientation", handleOrientation);
                            window.addEventListener("devicemotion", handleMotion);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener("deviceorientation", handleOrientation);
                window.addEventListener("devicemotion", handleMotion);
            }
        });
        
        document.getElementById("resetCube").addEventListener("click", () => {
            isInitialSet = false;
            posX = 150;
            posY = 150;
            size = 80;
            cube.style.left = "150px";
            cube.style.top = "150px";
            cube.style.width = "80px";
            cube.style.height = "120px";
        });
    </script>
</body>
</html>
