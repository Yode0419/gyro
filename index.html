<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陀螺儀數據測試</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
    <h2>手機陀螺儀與加速度數據</h2>
    <p>允許裝置存取陀螺儀以查看數據</p>
    <button id="enableSensors">啟用感測器</button>
    <button id="resetCube">復位</button>
    
    <script>
        let scene, camera, renderer, cube;
        let initialAlpha = 0, initialBeta = 0, initialGamma = 0;
        let isInitialSet = false;
        let posX = 0, posY = 0;
        
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth * 0.8, window.innerHeight * 0.6);
            document.body.appendChild(renderer.domElement);
            
            let geometry = new THREE.BoxGeometry(2, 3, 0.5);
            let material = new THREE.MeshBasicMaterial({ color: 0x0000ff, wireframe: true });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            camera.position.set(0, 5, 0);
            camera.lookAt(0, 0, 0);
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        
        function handleOrientation(event) {
            if (!isInitialSet) {
                initialAlpha = event.alpha;
                initialBeta = event.beta;
                initialGamma = event.gamma;
                isInitialSet = true;
            }
            
            let rotX = (event.beta - initialBeta) * (Math.PI / 180);
            let rotY = (event.gamma - initialGamma) * (Math.PI / 180);
            
            cube.rotation.x = rotX;
            cube.rotation.y = rotY;
        }
        
        function handleMotion(event) {
            let accel = event.acceleration;
            if (accel) {
                posX += accel.x * 0.1;
                posY -= accel.y * 0.1;
                cube.position.x = posX;
                cube.position.z = posY;
            }
        }
        
        document.getElementById("enableSensors").addEventListener("click", () => {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === "granted") {
                            window.addEventListener("deviceorientation", handleOrientation);
                            window.addEventListener("devicemotion", handleMotion);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener("deviceorientation", handleOrientation);
                window.addEventListener("devicemotion", handleMotion);
            }
        });
        
        document.getElementById("resetCube").addEventListener("click", () => {
            isInitialSet = false;
            cube.rotation.set(0, 0, 0);
            cube.position.set(0, 0, 0);
            posX = 0;
            posY = 0;
        });
        
        init();
    </script>
</body>
</html>
